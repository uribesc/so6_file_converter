[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so6-file-converter"
dynamic = ["version"]
description = "Convert .SO6 flight traffic files into pandas DataFrames"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "O" }]
keywords = ["so6", "air traffic", "flight", "trajectory", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pandas"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/uriibra/so6-file-converter"
Issues = "https://github.com/uriibra/so6-file-converter/issues"

[tool.hatch.version]
path = "src/so6_converter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/so6_converter"]
